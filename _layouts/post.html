layout: default
---
<article class="content-page article-page">
  <header class="article-header">
    <a class="back-link" href="{{ '/blog/' | relative_url }}">&larr; All notes</a>
    <h1>{{ page.title }}</h1>
    <p>{{ page.date | date: "%B %-d, %Y" }}</p>
  </header>
  <div class="prose">
    {{ content }}
  </div>
</article>
